baseURL = "https://blog.ramiyer.me"
languageCode = "en-GB"
title = "Ram’s blog"
theme = "typographical"
googleAnalytics = "UA-96215433-5"

[params]
  description = "For what it’s worth"
  enableTypographicalHyphenation = true
  enableDevanagari = true
  fbAppId = "1004129106665557"
  fbAccessToken = "c0ccefea32b8675b177da298022b672c"
  privacyPolicyUrl = "/privacy/"
  enableSharing = false
  razorpayId = "pl_G7QWxZCN9t3mZ1"
  plausibleAnalytics = true

[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
    respectDoNotTrack = true
    useSessionStorage = true
  [privacy.twitter]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[permalinks]
post = "/:title/"
page = "/:title/"

[Author]
name = "Ram Iyer"
url = "https://ramiyer.me"
twitter = "iamramiyer"
facebook = "iamramiyer"

[menu]
  [[menu.main]]
  identifier = "archive"
  pre = "<i class='fas fa-archive'></i>"
  title = "Archive"
  url = "/archive/"
  weight = 1
  [[menu.main]]
  identifier = "youtube"
  pre = "<i class='fab fa-youtube'></i>"
  title = "YouTube"
  url = "https://youtube.com/ramiyer"
  weight = 2
  [[menu.main]]
  identifier = "podcast"
  pre = "<i class='fas fa-headphones-alt'></i>"
  title = "Podcast"
  url = "https://anchor.fm/ramiyer"
  weight = 3
  [[menu.main]]
  identifier = "about"
  pre = "<i class='fas fa-info'></i>"
  title = "About"
  url = "/about/"
  weight = 4

[related]
threshold = 80.0
includeNewer = true
toLower = true
  [[related.indices]]
  name = "tags"
  weight = 100.0

[outputs]
  home = [ "HTML", "JSON", "RSS"]
  page = [ "HTML"]

canonifyURLs = true
copyright = "Ram Iyer"
enableRobotsTXT = true

EnableHyphenation = true

[sitemap]
    changefreq = "weekly"
    priority = 0.5
